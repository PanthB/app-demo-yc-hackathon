project:
    id: 8c97d6c0-b9d3-48e2-b81d-42f0868829f3
build:
    framework: ios
    profiles:
        preview:
            ios:
                app_id: 75c6da70-69c5-45a4-afc5-2fa1be790927
                setup_commands:
                    - command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
                    - cd ios && xcodegen generate
                build_commands:
                    - cd ios && xcodebuild -project AppDemo.xcodeproj -scheme AppDemo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build build
                output_path: ios/build/Build/Products/Debug-iphonesimulator/AppDemo.app
                timeout_seconds: 1800
session:
    idle_timeout_seconds: 1800
