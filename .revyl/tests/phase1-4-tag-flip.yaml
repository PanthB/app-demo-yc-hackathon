test:
  metadata:
    name: phase1-4-tag-flip
    platform: ios
    tags:
      - phase1
      - board
      - deferred
  build:
    name: app-demo-yc-hackathon
  variables:
    share-target: "Moments"
    share-url: "https://www.google.com/maps/place/Tartine+Bakery,+600+Guerrero+St,+San+Francisco,+CA+94110"
  blocks:
    - type: manual
      step_type: navigate
      step_description: "{{share-url}}"
    - type: instructions
      step_description: Wait for the page to finish loading, then tap Safari's Share button. If the toolbar has no Share button, tap the More (…) button first and choose Share from its menu. In the share sheet, pick {{share-target}} from the row of apps, and if it isn't in the row, scroll the row or tap More to find it.
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: manual
      step_type: wait
      step_description: "20"
    - type: instructions
      step_description: Tap the Tartine Bakery object once.
    - type: validation
      step_description: The object has flipped over to its tag, which shows who dropped it, what was read from it (such as Tartine Bakery or San Francisco), and when it was saved.
    - type: instructions
      step_description: Tap the tag once to flip it back.
    - type: validation
      step_description: The Tartine Bakery object shows its front again.
