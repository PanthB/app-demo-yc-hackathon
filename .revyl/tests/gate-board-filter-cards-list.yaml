# Revyl Test Definition

_meta:
    remote_id: 5f4c587d-2ee0-40df-a8ba-e98a67465742
    remote_version: 1
    local_version: 1
    last_synced_at: "2026-11-15T22:27:08Z"
    checksum: 8799160c6145c74baf6645cfedccdf7dc4f970527dbfbf52576e75b47aab3aa2
test:
    metadata:
        name: gate-board-filter-cards-list
        platform: ios
        tags:
            - gate
            - glass
            - boards
            - qa-board
    build:
        name: app-demo-yc-hackathon
    variables:
        invite-code: SFCREW
        person-name: revyl gate
        qa-code: <qa board code>
        qa-name: <qa board name>
        qa-title: tacos
    blocks:
        - type: manual
          step_type: open_app
        - type: if
          condition: Is a system permission prompt (location or notifications) visible?
          then:
            - type: instructions
              step_description: Tap the button that allows it (Allow While Using App, or Allow).
        - type: if
          condition: Is the app showing a welcome or first-run screen instead of a board?
          then:
            - type: instructions
              step_description: Choose start fresh, not the demo, and continue as a guest if it asks how to sign in. Then tap skip, or the bottom button through any remaining steps, until a board with a glass bar at the bottom shows.
        - type: manual
          step_type: navigate
          step_description: appdemo://join/{{qa-code}}
        - type: if
          condition: Is a dialog asking whether to open this in the app visible?
          then:
            - type: instructions
              step_description: Tap Open.
        - type: if
          condition: Is the sheet asking for your name?
          then:
            - type: instructions
              step_description: Type {{person-name}} in the your name field.
        - type: instructions
          step_description: Tap join at the top right of the sheet.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: manual
          step_type: navigate
          step_description: appdemo://join/{{invite-code}}
        - type: if
          condition: Is a dialog asking whether to open this in the app visible?
          then:
            - type: instructions
              step_description: Tap Open.
        - type: if
          condition: Is the sheet asking for your name?
          then:
            - type: instructions
              step_description: Type {{person-name}} in the your name field.
        - type: instructions
          step_description: Tap join at the top right of the sheet.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: manual
          step_type: navigate
          step_description: appdemo://view/cards
        - type: validation
          step_description: The title at the top reads sf crew, and sections are named by vibe (for example golden hour, by the water).
        - type: validation
          step_description: No card titled {{qa-title}} is anywhere in the cards view, and no card is saved by qa friend.
        - type: manual
          step_type: navigate
          step_description: appdemo://view/list
        - type: validation
          step_description: The title still reads sf crew and no row titled {{qa-title}} is showing.
        - type: manual
          step_type: navigate
          step_description: appdemo://view/night
        - type: instructions
          step_description: Tap the board name at the top left and choose {{qa-name}} from the menu.
        - type: manual
          step_type: navigate
          step_description: appdemo://view/cards
        - type: validation
          step_description: The title reads {{qa-name}}, a card titled {{qa-title}} is showing, and no card is saved by maya, sam, alex or panth.
