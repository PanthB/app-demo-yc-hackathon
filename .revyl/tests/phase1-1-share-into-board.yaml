test:
  metadata:
    name: phase1-1-share-into-board
    platform: ios
    tags:
      - phase1
      - share
  build:
    name: app-demo-yc-hackathon
  variables:
    share-target: "Moments"
    share-url: "https://www.google.com/maps/place/Tartine+Bakery,+600+Guerrero+St,+San+Francisco,+CA+94110"
  blocks:
    - type: manual
      step_type: navigate
      step_description: "{{share-url}}"
    - type: instructions
      step_description: Wait for the page to finish loading, then tap Safari's Share button. If the toolbar has no Share button, tap the More (…) button first and choose Share from its menu. In the share sheet, pick {{share-target}} from the row of apps, and if it isn't in the row, scroll the row or tap More to find it.
    - type: validation
      step_description: The share sheet confirms the drop in a friendly line that starts with "dropped it", such as "dropped it in sf crew." or "dropped it, i'll find it a spot."
    - type: manual
      step_type: open_app
      step_description: com.apple.mobileslideshow
    - type: instructions
      step_description: Open any photo in the library, tap Share, and pick {{share-target}} from the row of apps. If it isn't in the row, scroll the row or tap More to find it.
    - type: validation
      step_description: The share sheet confirms the drop in a friendly line that starts with "dropped it".
