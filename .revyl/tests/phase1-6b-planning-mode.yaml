test:
  metadata:
    name: phase1-6b-planning-mode
    platform: ios
    tags:
      - phase1
      - location
      - modes
  build:
    name: app-demo-yc-hackathon
  variables:
    home-location: "37.7793,-122.4193"
  blocks:
    - type: manual
      step_type: set_location
      step_description: "{{home-location}}"
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: instructions
      step_description: Add a typed note to the board that says "farmers market this saturday morning".
    - type: manual
      step_type: wait
      step_description: "20"
    - type: validation
      step_description: The board is in planning mode for an evening at home. Weekend items such as the farmers market note are pulled forward, and a line mentions what's open this weekend or on saturday.
