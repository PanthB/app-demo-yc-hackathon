test:
  metadata:
    name: phase1-2-drop-lands-on-board
    platform: ios
    tags:
      - phase1
      - board
  build:
    name: app-demo-yc-hackathon
  variables:
    share-target: "Moments"
    share-url: "https://en.wikipedia.org/wiki/Tartine_Bakery"
  blocks:
    - type: manual
      step_type: navigate
      step_description: "{{share-url}}"
    - type: instructions
      step_description: Tap the Share button in Safari and pick {{share-target}} from the row of apps in the share sheet. If it isn't in the row, scroll the row or tap More to find it.
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: validation
      step_description: The board shows the Tartine Bakery link as an object right away, even if it still looks plain or unprocessed.
    - type: manual
      step_type: wait
      step_description: "20"
    - type: validation
      step_description: The Tartine Bakery object now sits inside one of the board's zones (now, tonight, this weekend, someday or vibes) and is still on the board.
