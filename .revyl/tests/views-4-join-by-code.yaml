test:
  metadata:
    name: views-4-join-by-code
    platform: ios
    tags:
      - views
      - shared
  build:
    name: app-demo-yc-hackathon
  variables:
    invite-code: "SFCREW"
    person-name: "revyl"
  blocks:
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: instructions
      step_description: Tap the title at the top to open the board menu, and choose join with a code.
    - type: if
      condition: Is the app asking for your name?
      then:
        - type: instructions
          step_description: Type {{person-name}} as the name and continue.
    - type: instructions
      step_description: Type the code {{invite-code}} and confirm.
    - type: validation
      step_description: The title now reads sf crew, and drops saved by several people (such as panth, maya, sam and alex) are showing.
    - type: instructions
      step_description: Tap the title at the top to open the board menu again.
    - type: validation
      step_description: The board menu lists both my board and sf crew.
