          condition: Is a dialog asking whether to open this in the app visible?
          then:
            - type: instructions
              step_description: Tap Open.
        - type: validation
          step_description: A sheet titled "join a board" is showing.
        - type: instructions
          step_description: In the join a board sheet, type {{person-name}} as your name if it asks for one, make sure the code field reads {{invite-code}} (type it if it's empty), then tap join.
        - type: manual
          step_type: wait
          step_description: "5"
        - type: validation
          step_description: The title now reads sf crew, and drops saved by several people (such as panth, maya, sam and alex) are showing.
