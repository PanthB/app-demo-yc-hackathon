test:
  metadata:
    name: phase1-5-countdown-notification
    platform: ios
    tags:
      - phase1
      - countdown
      - notifications
  build:
    name: app-demo-yc-hackathon
  blocks:
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: instructions
      step_description: Tap the plus button at the bottom right, choose note, and add a note that says "remind me in 1 hr to call mom".
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: validation
      step_description: An item about calling mom has a reminder pill and a live countdown showing about an hour (59 or 60 minutes) left.
    - type: instructions
      step_description: Tap the plus button at the bottom right, choose note, and add a note that says "remind me in 1 minute to stretch".
    - type: validation
      step_description: An item about stretching has a reminder pill and a countdown showing less than a minute left.
    - type: manual
      step_type: go_home
    - type: manual
      step_type: wait
      step_description: "75"
    - type: instructions
      step_description: Swipe down from the top-left edge of the screen to open Notification Center.
    - type: validation
      step_description: Notification Center shows a notification from the app about stretching.
