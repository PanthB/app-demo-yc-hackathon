test:
  metadata:
    name: views-3-filter-mine
    platform: ios
    tags:
      - views
      - shared
      - offline-seed
  build:
    name: app-demo-yc-hackathon
  blocks:
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: if
      condition: Is the app showing a welcome or first-run screen instead of a board?
      then:
        - type: instructions
          step_description: Choose start fresh, not the demo, and continue as a guest if it asks how to sign in. Then tap skip, or the bottom button through any remaining steps, until a board with a glass bar at the bottom shows.
    - type: instructions
      step_description: Tap the title my board at the top to open the board menu, and choose sf crew.
    - type: validation
      step_description: The title reads sf crew. Under it, a segmented control has everyone selected, and the drops carry the avatars of several different people.
    - type: instructions
      step_description: Tap mine in the segmented control under the title.
    - type: validation
      step_description: Only one person's drops are showing. Every visible drop carries the same avatar or says it's yours, and none is by maya, sam or alex.
    - type: instructions
      step_description: Tap everyone in the segmented control under the title.
    - type: validation
      step_description: Drops from several different people are showing again.
