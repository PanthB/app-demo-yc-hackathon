test:
  metadata:
    name: views-1-switch
    platform: ios
    tags:
      - views
  build:
    name: app-demo-yc-hackathon
  blocks:
    - type: manual
      step_type: open_app
    - type: if
      condition: Is a system permission prompt (location or notifications) visible?
      then:
        - type: instructions
          step_description: Tap the button that allows it (Allow While Using App, or Allow).
    - type: manual
      step_type: navigate
      step_description: "appdemo://seed"
    - type: if
      condition: Is a dialog asking whether to open this in the app visible?
      then:
        - type: instructions
          step_description: Tap Open.
    - type: manual
      step_type: wait
      step_description: "2"
    - type: validation
      step_description: The cards view is showing. Drops are cards in a two-column grid under lowercase section headers such as pinned, now and someday, and every card has a small type pill in its top leading corner.
    - type: extraction
      step_description: What is the title of the first drop in the pinned section? Answer with just the title.
      variable_name: pinned-title
    - type: instructions
      step_description: In the floating bar at the bottom, tap the list view icon in the view switch.
    - type: validation
      step_description: The list view is showing. Drops are rows with a small square thumbnail, a title and one meta line, under the same section headers, and {{pinned-title}} is still in the pinned section at the top.
    - type: instructions
      step_description: In the floating bar at the bottom, tap the board view icon in the view switch.
    - type: validation
      step_description: The board view is showing. Drops are objects on a corkboard, lined up by section rather than scattered, each with a type pill, and {{pinned-title}} is with the pinned ones at the top.
    - type: instructions
      step_description: In the floating bar at the bottom, tap the cards view icon in the view switch.
    - type: validation
      step_description: The cards view is showing again, with {{pinned-title}} in the pinned section at the top.
